# DeepSeek V4.1-1017 UNCENSORED native FP8/FP4, SGLang TP=3, 3-node RoCE ring.
# Same .env on all nodes. Prepare sources/model/Engram before compose up.
x-env: &env
  MODEL_REPO: ${MODEL_REPO}
  MODEL_REVISION: ${MODEL_REVISION}
  MODEL_PATH: ${MODEL_CONTAINER_PATH}
  DSV41_SOURCE: ${MODEL_CONTAINER_PATH}
  SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
  SERVER_PORT: ${HOST_PORT:-8910}
  STATE_PATH: /state
  NNODES: ${NNODES:-3}
  TP_SIZE: ${TP_SIZE:-3}
  EP_SIZE: ${EP_SIZE:-1}
  HEAD_NODE_IP: ${HEAD_NODE_IP}
  WORKER1_NODE_IP: ${WORKER1_NODE_IP}
  WORKER2_NODE_IP: ${WORKER2_NODE_IP}
  DIST_INIT_ADDR: ${HEAD_NODE_IP}:${DIST_PORT:-20000}
  # All checkpoint access is local and read-only. Never download the base model on boot.
  SKIP_PREPARE: "1"
  SKIP_VERIFY: "1"
  SKIP_SMOKE: "1"
  WARMUP: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  OFFLOAD_MODE: ${OFFLOAD_MODE:-nvme}
  SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "0"
  CUDA_DEVICE_ORDER: PCI_BUS_ID
  DSV41_PACKED_DIR: /engram
  DSV41_CACHE_GIB: ${DSV41_CACHE_GIB:-0}
  DSV41_RESIDENT_SCALES: ${DSV41_RESIDENT_SCALES:-0}
  DSV41_IO_THREADS: ${DSV41_IO_THREADS:-96}
  DSV41_TP_PAD: ${DSV41_TP_PAD:-1}
  CONTEXT_LENGTH: ${CONTEXT_LENGTH:-32768}
  MAX_TOTAL_TOKENS: ${MAX_TOTAL_TOKENS:-131072}
  MAX_RUNNING_REQUESTS: ${MAX_RUNNING_REQUESTS:-2}
  CHUNKED_PREFILL_SIZE: ${CHUNKED_PREFILL_SIZE:-512}
  MEM_FRACTION_STATIC: ${MEM_FRACTION_STATIC:-0.95}
  SPEC_ALGO: ${SPEC_ALGO:-DSPARK}
  DSPARK_BLOCK_SIZE: ${DSPARK_BLOCK_SIZE:-3}
  # Initialize PyTorch's NCCL communicator before weights consume unified RAM.
  EXTRA_SGLANG_ARGS: --fp8-gemm-backend flashinfer_cutlass --watchdog-timeout 1800 --sleep-on-idle --pre-warm-nccl
  DSV41_MXFP8_BACKEND: b12x
  DSV41_WO_A_W8: ${DSV41_WO_A_W8:-1}
  DSV41_WO_A_W8_MID: ${DSV41_WO_A_W8_MID:-1}
  DSV41_WO_A_W8_DROP: ${DSV41_WO_A_W8_DROP:-1}
  DSV41_WO_A_W8_DRAFT: "0"
  DSV41_DRAFT_HEAD_FP8: ${DSV41_DRAFT_HEAD_FP8:-1}
  DSV41_VERIFY_CAP: ${DSV41_VERIFY_CAP:-0}
  DSV41_BLOCK_VERIFY: "1"
  DSV41_ENGRAM_PREFETCH: ${DSV41_ENGRAM_PREFETCH:-1}
  DSV41_FOLDED_FENCE: "0"
  DSV41_AUTOTUNE_KEEP: "1"
  SGLANG_FLASHINFER_MOE_FUSED_FINALIZE: "0"
  SGLANG_DSV41_REASONING_EFFORT: "75"
  DSV41_MAX_NEW_TOKENS: ${DSV41_MAX_NEW_TOKENS:-16384}
  DSV41_LOOP_ABORT: "1"
  DSV41_PREFILL_EMPTY_CACHE_TOKENS: ${DSV41_PREFILL_EMPTY_CACHE_TOKENS:-8192}
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
  NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME:-enP7s7}
  GLOO_SOCKET_IFNAME: ${GLOO_SOCKET_IFNAME:-enP7s7}
  NCCL_IB_HCA: =${IB_HCA_NAME}
  NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX:-}
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_RANGE: ${NCCL_IB_ADDR_RANGE:-192.168.0.0/21}
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_IB_SUBNET_PREFIX_LEN: "24"
  NCCL_IB_EXTENDED_IPV4_GIDS: "1"
  NCCL_IB_PRESERVE_PCI_DOMAIN: "1"
  NCCL_CROSS_NIC: "1"
  NCCL_ALGO: Ring
  # Every pair is adjacent in a 3-node ring; no TP4-only launcher is used.
  NCCL_P2P_DISABLE: "1"
  NCCL_SHM_DISABLE: "1"
  NCCL_CUMEM_ENABLE: "0"
  # Local NCCL patch: ordinary host RAM + cudaHostRegister for NET buffers.
  NCCL_NET_HOST_REGISTER: ${NCCL_NET_HOST_REGISTER:-1}
  NCCL_BUFFSIZE: ${NCCL_BUFFSIZE:-1048576}
  NCCL_LL128_BUFFSIZE: ${NCCL_LL128_BUFFSIZE:-262144}
  NCCL_PROTO: ${NCCL_PROTO:-^LL128}
  NCCL_MAX_NCHANNELS: ${NCCL_MAX_NCHANNELS:-4}
  NCCL_DEBUG: ${NCCL_DEBUG:-INFO}
  MAX_JOBS: ${MAX_JOBS:-4}
  READY_TIMEOUT_S: "3600"

x-model: &model
  image: ${SGLANG_IMAGE:-llm-deepseek41-sglang:tp3-1017-v2}
  pull_policy: build
  build:
    context: ./.cache/deepseek41-tp3/upstream
    dockerfile: ../../../Dockerfile.deepseek41
    additional_contexts:
      nccl_source: ./.cache/deepseek41-tp3/nccl
      local_patches: ./patches/deepseek41
    args:
      MAX_JOBS: ${MAX_JOBS:-4}
  network_mode: host
  ipc: host
  init: true
  gpus: all
  cap_add: [IPC_LOCK]
  devices:
    - /dev/infiniband:/dev/infiniband
    - /dev/nvidia0:/dev/nvidia0
    - /dev/nvidiactl:/dev/nvidiactl
    - /dev/nvidia-uvm:/dev/nvidia-uvm
    - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
  ulimits:
    memlock: -1
    stack: 67108864
    core: 0
  shm_size: 64gb
  oom_score_adj: 1000
  restart: "no"
  entrypoint: [bash, /opt/llm/entrypoint.sh]
  volumes:
    - type: bind
      source: ${MODEL_PATH}
      target: ${MODEL_CONTAINER_PATH}
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ENGRAM_PATH}
      target: /engram
      read_only: true
      bind:
        create_host_path: false
    - ./scripts/entrypoint.sh:/opt/llm/entrypoint.sh:ro
    - ./scripts/deepseek41_config.py:/opt/llm/deepseek41_config.py:ro
    - ./.cache/deepseek41-tp3/runtime/cache:/root/.cache
    - ./.cache/deepseek41-tp3/runtime/state:/state
    - /sys/class/infiniband:/sys/class/infiniband:ro

services:
  head:
    <<: *model
    container_name: deepseek41-head
    profiles: [head]
    environment:
      <<: *env
      NODE_RANK: "0"
      HOST_IP: ${HEAD_NODE_IP}
      VLLM_HOST_IP: ${HEAD_NODE_IP}
  worker1:
    <<: *model
    container_name: deepseek41-worker1
    profiles: [worker1]
    environment:
      <<: *env
      NODE_RANK: "1"
      HOST_IP: ${WORKER1_NODE_IP}
      VLLM_HOST_IP: ${WORKER1_NODE_IP}
    # SGLang non-head ranks do not expose an HTTP API.
    healthcheck:
      disable: true
  worker2:
    <<: *model
    container_name: deepseek41-worker2
    profiles: [worker2]
    environment:
      <<: *env
      NODE_RANK: "2"
      HOST_IP: ${WORKER2_NODE_IP}
      VLLM_HOST_IP: ${WORKER2_NODE_IP}
    healthcheck:
      disable: true
