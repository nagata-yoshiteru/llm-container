services:
  glm52-gguf:
    build:
      context: .
    image: llm-vllm-gguf:glm52
    container_name: glm52-gguf
    restart: unless-stopped

    # 2-node / NCCL / Ray では rootful Docker + host network 推奨
    network_mode: host
    ipc: host
    shm_size: "32gb"
    gpus: all
    privileged: true

    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${VLLM_CACHE_DIR:-./vllm-cache}/vllm:/var/cache/vllm
      - ${VLLM_CACHE_DIR:-./vllm-cache}/torchinductor:/var/cache/torchinductor
      - ${VLLM_CACHE_DIR:-./vllm-cache}/triton:/var/cache/triton
      - ${VLLM_CACHE_DIR:-./vllm-cache}/torch_extensions:/var/cache/torch_extensions

    environment:
      HF_TOKEN: ${HF_TOKEN:-}

      ROLE: ${ROLE}
      NODE_IP: ${NODE_IP}
      HEAD_IP: ${HEAD_IP}

      MODEL_ID: ${MODEL_ID:-unsloth/GLM-5.2-GGUF:UD-IQ1_S}
      BASE_MODEL_ID: ${BASE_MODEL_ID:-zai-org/GLM-5.2}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-glm-5.2-iq1s}

      API_PORT: ${API_PORT:-8910}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-200000}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.80}

      VLLM_CACHE_ROOT: /var/cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /var/cache/torchinductor
      TRITON_CACHE_DIR: /var/cache/triton
      TORCH_EXTENSIONS_DIR: /var/cache/torch_extensions

      NCCL_DEBUG: ${NCCL_DEBUG:-WARN}
      NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME:-}
      NCCL_IB_HCA: ${NCCL_IB_HCA:-}

      NETWORK_IFACE: ${NETWORK_IFACE}

      # PyTorch distributed / Gloo / NCCL が loopback を選ばないようにする
      GLOO_SOCKET_IFNAME: ${NETWORK_IFACE}

      # vLLM / Ray が接続先を拾えるようにする
      RAY_ADDRESS: ${HEAD_IP}:6379
      VLLM_HOST_IP: ${NODE_IP}

    entrypoint: []
    command:
      - /bin/bash
      - -lc
      - |
        set -euxo pipefail

        which vllm
        vllm --version || true
        python3 - <<'PY'
        import importlib.util
        import vllm
        print("python vllm:", vllm.__version__)
        print("vllm_gguf_plugin:", importlib.util.find_spec("vllm_gguf_plugin"))
        PY

        # image 側などで unknown 扱いされる VLLM_* が入っていた場合の掃除
        unset VLLM_ATTENTION_BACKEND || true
        unset VLLM_BASE_DIR || true

        # stale Ray 対策
        ray stop --force || true
        rm -rf /tmp/ray || true
        sleep 2

        if [ "${ROLE}" = "worker" ]; then
          until python3 - <<PY
        import socket, sys
        s = socket.socket()
        s.settimeout(2)
        try:
            s.connect(("${HEAD_IP}", 6379))
            sys.exit(0)
        except Exception:
            sys.exit(1)
        finally:
            s.close()
        PY
          do
            echo "waiting for Ray head ${HEAD_IP}:6379 ..."
            sleep 2
          done

          exec ray start \
            --address="${HEAD_IP}:6379" \
            --node-ip-address="${NODE_IP}" \
            --disable-usage-stats \
            --block
        fi

        ray start \
          --head \
          --node-ip-address="${NODE_IP}" \
          --port=6379 \
          --dashboard-host=0.0.0.0 \
          --disable-usage-stats

        # Ray cluster が見えるか軽く確認
        ray status || true

        exec vllm serve "${MODEL_ID}" \
          --tokenizer "${BASE_MODEL_ID}" \
          --hf-config-path "${BASE_MODEL_ID}" \
          --host 0.0.0.0 \
          --port "${API_PORT}" \
          --served-model-name "${SERVED_MODEL_NAME}" \
          --distributed-executor-backend ray \
          --tensor-parallel-size 2 \
          --max-model-len "${MAX_MODEL_LEN}" \
          --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION}" \
          --max-num-seqs 1 \
          --enable-prefix-caching \
          --kv-cache-dtype fp8

