services:
  gpt-oss-120b:
    image: eugr/spark-vllm:latest
    container_name: gpt-oss-120b
    restart: unless-stopped

    gpus: all
    ipc: host

    ports:
      - "0.0.0.0:8910:8910"

    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/vllm/torchinductor:/cache/torchinductor
      - ${HOME}/.cache/vllm/triton:/cache/triton
      - ${HOME}/.cache/vllm/torch_extensions:/cache/torch_extensions

    environment:
      HF_TOKEN: ${HF_TOKEN:-}

      # DGX Spark / Blackwell向け
      VLLM_ATTENTION_BACKEND: FLASHINFER

      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      TRITON_CACHE_DIR: /cache/triton
      TORCH_EXTENSIONS_DIR: /cache/torch_extensions

    entrypoint: []
    command:
      - /bin/bash
      - -lc
      - |
        set -eux

        which vllm
        vllm -v || true
        python3 - <<'PY'
        import vllm
        print("python vllm:", vllm.__version__)
        PY

        exec vllm serve openai/gpt-oss-120b \
          --host 0.0.0.0 \
          --port 8910 \
          --served-model-name gpt-oss-120b \
          --max-model-len 131072 \
          --gpu-memory-utilization 0.90 \
          --kv-cache-dtype fp8 \
          --max-num-seqs 4 \
          --max-num-batched-tokens 8192 \
          --enable-auto-tool-choice \
          --tool-call-parser openai \
          --reasoning-parser openai_gptoss \
          --enable-prefix-caching

