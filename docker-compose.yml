# GLM-5.3-Flash UNCENSORED / kindling TP=3 on three DGX Spark hosts.
# Same shared .env and profiles as before. Each profile starts one local mentatd.
# First prepare sources/weights: python3 scripts/prepare-glm53-tp3.py
# Then: sudo docker compose --profile head|worker1|worker2 up -d
# Stop ALL three old model containers before starting this new TP cluster.

x-image: &image
  image: ${VLLM_IMAGE:-llm-glm53-kindling:tp3-v2}
  # Build on up, with Docker's layer cache; no separate image-build wrapper.
  pull_policy: build
  build:
    context: ./.cache/kindling-tp3/upstream
    dockerfile: ../../../Dockerfile.kindling
    additional_contexts:
      local_patches: ./patches/kindling

x-runtime: &runtime
  <<: *image
  network_mode: host
  ipc: host
  init: true
  gpus: all
  devices:
    - /dev/infiniband:/dev/infiniband
    # Explicit device rules also work with NVIDIA no-cgroups=true on these hosts.
    - /dev/nvidia0:/dev/nvidia0
    - /dev/nvidiactl:/dev/nvidiactl
    - /dev/nvidia-uvm:/dev/nvidia-uvm
    - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
  ulimits:
    memlock: -1
    stack: 67108864
    core: 0
  restart: "no"

x-env: &env
  MODEL_DIR: ${MODEL_CONTAINER_PATH}
  SERVED_NAME: ${SERVED_MODEL_NAME}
  API_PORT: ${HOST_PORT:-8910}
  STATUS_PORT: ${STATUS_PORT:-8082}
  TP: ${TP_SIZE:-3}
  HEAD_HOST: ${HEAD_ROCE_IP}
  CLUSTER_SUBNET: ${CLUSTER_SUBNET:-192.168.0.}
  FABRIC_SUBNETS: ${FABRIC_SUBNETS:-192.168.0. 192.168.1.}
  RAY_ADDRESS: 127.0.0.1:6379
  MENTAT_GROUP: glm53-uncensored-tp3
  MENTAT_UNIVERSE: llm-uncensored-tp3
  SERVICE_NAME: glm53-uncensored-tp3
  # Keep the checkpoint's own MTP draft; adaptive-k and DFlash are not enabled.
  SPEC_METHOD: mtp
  SPEC_TOKENS: ${MTP_NUM_SPECULATIVE_TOKENS:-3}
  SPEC_EXTRA: ""
  MOE_BACKEND: marlin
  MAX_MODEL_LEN: ${MAX_MODEL_LEN:-524288}
  MAX_NUM_SEQS: ${MAX_NUM_SEQS:-8}
  MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
  LONG_PREFILL_TOKEN_THRESHOLD: ${LONG_PREFILL_TOKEN_THRESHOLD:-7168}
  GPU_MEM_UTIL: ${GPU_MEMORY_UTILIZATION:-0.85}
  KV_CACHE_MEMORY: ${KV_CACHE_MEMORY:-12884901888}
  KV_CACHE_DTYPE: fp8_e4m3
  BLOCK_SIZE: ${BLOCK_SIZE:-3456}
  CUDAGRAPH_CAPTURE_SIZES: ${CUDAGRAPH_CAPTURE_SIZES:-4 8 16 32}
  CUDAGRAPH_MODE: FULL_DECODE_ONLY
  CUDA_GRAPHS: "1"
  LIMIT_MM: '{"image":0,"video":0}'
  SKIP_MM_PROFILING: "1"
  EXTRA_ARGS: --language-model-only --mm-encoder-tp-mode data
  TOOL_PARSER: glm47
  # These W4A16 weights have no activation scales: do not enable W4A4 megamoe.
  VLLM_DENSE_FP8: ${GLM53_DENSE_FP8:-1}
  VLLM_DENSE_W4: ""
  VLLM_DENSE_FP8_LM_HEAD: "0"
  VLLM_WEIGHT_SNAPSHOT_DIR: /root/.cache/weight-snapshots
  VLLM_WEIGHT_SNAPSHOT_TAG: uncensored-tp3-mtp${MTP_NUM_SPECULATIVE_TOKENS:-3}-fp8${GLM53_DENSE_FP8:-1}-main-v2-c748079
  VLLM_ARX_ALLREDUCE: "1"
  VLLM_ARXBIG: "1"
  VLLM_ARXBIG_RS: "1"
  VLLM_ARXBIG_AG: "0"
  VLLM_ARX_TWO_SHOT_MAX_KB: "2048"
  VLLM_MHC_FUSED_MAX_TOKENS: "32"
  VLLM_TRITON_SPARSE_MLA: "1"
  VLLM_GLM5NEXT_DRAFT_POOL: "1"
  VLLM_GLM5NEXT_RECOVERSSM: "1"
  VLLM_GLM_SP_TP: "1"
  VLLM_GLM_SP_MIN_TOKENS: "1024"
  VLLM_GLM_SP_FP8_GATHER: ${GLM53_DENSE_FP8:-1}
  VLLM_GLM_ARX_PREFETCH: "1"
  VLLM_GLM_SP_MOE_FUSED: "0"
  VLLM_GLM_SP_MOE_QUANT_GATHER: "0"
  # kindling derives exact NIC/HCA/GID from FABRIC_SUBNETS on each host.
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX:-}
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_RANGE: ${NCCL_IB_ADDR_RANGE:-192.168.0.0/24,192.168.1.0/24}
  NCCL_IB_MERGE_NICS: ${NCCL_IB_MERGE_NICS:-1}
  NCCL_CROSS_NIC: ${NCCL_CROSS_NIC:-1}
  NCCL_NET: IB
  NCCL_NVLS_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_BUFFSIZE: ${NCCL_BUFFSIZE:-1048576}
  NCCL_LL128_BUFFSIZE: ${NCCL_LL128_BUFFSIZE:-262144}
  NCCL_PROTO: ${NCCL_PROTO:-^LL128}
  NCCL_MAX_NCHANNELS: ${NCCL_MAX_NCHANNELS:-8}
  NCCL_DEBUG: ${NCCL_DEBUG:-WARN}
  MAX_JOBS: ${MAX_JOBS:-4}
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "7200"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

x-model: &model
  <<: *runtime
  shm_size: 64gb
  oom_score_adj: 1000
  entrypoint: ["bash", "/usr/local/bin/llm-entrypoint.sh"]
  volumes:
    - type: bind
      source: ${MODEL_PATH}
      target: ${MODEL_CONTAINER_PATH}
      read_only: true
      bind:
        create_host_path: false
    - ./scripts/entrypoint.sh:/usr/local/bin/llm-entrypoint.sh:ro
    - ./.cache/kindling-tp3/runtime/cache:/root/.cache
    - ./.cache/kindling-tp3/runtime/logs:/logs
    - /run/systemd/units:/host/systemd-units:ro
    - /sys/class/infiniband:/sys/class/infiniband:ro

x-mentat: &mentat
  <<: *runtime
  entrypoint: ["/usr/local/bin/mentatd"]
  command: ["daemon"]

x-mentat-env: &mentat-env
  MENTAT_PEERS: ${HEAD_ROCE_IP}:6379,${WORKER1_ROCE_IP}:6379,${WORKER2_ROCE_IP}:6379
  MENTAT_UNIVERSE: llm-uncensored-tp3
  MENTAT_ANNOUNCE_PORT: "0"

services:
  head:
    <<: *model
    container_name: glm53-fp8-head
    profiles: [head]
    depends_on: [mentat-head]
    environment:
      <<: *env
      ROLE: head
      VLLM_HOST_IP: ${HEAD_ROCE_IP}
  worker1:
    <<: *model
    container_name: glm53-fp8-worker1
    profiles: [worker1]
    depends_on: [mentat-worker1]
    environment:
      <<: *env
      ROLE: worker
      VLLM_HOST_IP: ${WORKER1_ROCE_IP}
  worker2:
    <<: *model
    container_name: glm53-fp8-worker2
    profiles: [worker2]
    depends_on: [mentat-worker2]
    environment:
      <<: *env
      ROLE: worker
      VLLM_HOST_IP: ${WORKER2_ROCE_IP}
  mentat-head:
    <<: *mentat
    container_name: glm53-mentat-head
    profiles: [head]
    environment:
      <<: *mentat-env
      MENTAT_NODE_IP: ${HEAD_ROCE_IP}
      MENTAT_ANNOUNCE_ADDRS: ${HEAD_ROCE_IP}=lan+connectx+rdma,${HEAD_ROCE_IP_2}=connectx+rdma
  mentat-worker1:
    <<: *mentat
    container_name: glm53-mentat-worker1
    profiles: [worker1]
    environment:
      <<: *mentat-env
      MENTAT_NODE_IP: ${WORKER1_ROCE_IP}
      MENTAT_ANNOUNCE_ADDRS: ${WORKER1_ROCE_IP}=lan+connectx+rdma,${WORKER1_ROCE_IP_2}=connectx+rdma
  mentat-worker2:
    <<: *mentat
    container_name: glm53-mentat-worker2
    profiles: [worker2]
    environment:
      <<: *mentat-env
      MENTAT_NODE_IP: ${WORKER2_ROCE_IP}
      MENTAT_ANNOUNCE_ADDRS: ${WORKER2_ROCE_IP}=lan+connectx+rdma,${WORKER2_ROCE_IP_2}=connectx+rdma
