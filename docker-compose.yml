# =============================================================================
# nvidia/Qwen3.8-Flash-Next-NVFP4 / 単一ホスト + SM12x GPU 複数枚
#   (RTX PRO 6000 Blackwell 等。既定値は 96 GB 級カード 2 枚を想定)
#
#   TP=TP_SIZE (同一ホスト内の GPU) / distributed-executor-backend = mp
#   GPU 間は NVLink か PCIe。RDMA も RoCE も Ray も要らない。
#   MTP 投機デコード (k=3) + 1M context (static YaRN factor 4.0)
#
# API は ${HOST_PORT} (既定 8910) に OpenAI 互換で生える。
#
#   起動:  ./scripts/preflight.sh && sudo docker compose up -d
#   ログ:  sudo docker compose logs -f
#   停止:  sudo docker compose down
#
# ---------------------------------------------------------------------------
# DGX Spark x2 ブランチからの差分 (なぜ消えたか)
#
#   ・head / worker profile        -> 1 ノードなのでサービスは 1 つ
#   ・NNODES / NODE_RANK / MASTER_* -> マルチノード rendezvous が不要
#   ・NCCL_IB_* / ROCE_* / GID     -> RDMA を使わない。NCCL は PCIe P2P を使う
#   ・/dev/infiniband, /sys/class/infiniband マウント -> 同上
#   ・network_mode: host           -> ポートマッピングで足りる
#   ・VLLM_NCCL_SO_PATH            -> aarch64 のパスだった。x86_64 では
#                                     イメージ同梱の NCCL に任せる
#
#   逆に SM12x ファミリ (GB10 = sm_121 / RTX PRO 6000 = sm_120) 共通の
#   数値まわりの約束事はそのまま引き継いでいる。下の「SM12x 数値契約」参照。
# =============================================================================

services:
  vllm:
    image: ${VLLM_IMAGE}
    container_name: qwen38-flash-next

    environment:
      # ---- モデル / サービング ----
      MODEL_CONTAINER_PATH: ${MODEL_CONTAINER_PATH}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
      HOST_PORT: ${HOST_PORT:-8910}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-1048576}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-8}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-16384}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.92}
      TP_SIZE: ${TP_SIZE:-2}
      VLLM_PARSER_ARGS: ${VLLM_PARSER_ARGS:-}
      VLLM_KV_ARGS: ${VLLM_KV_ARGS:-}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}

      # ---- NCCL (単一ノード) ----
      #
      # RDMA を使わない構成なので IB を明示的に切る。切らないと NCCL が起動の
      # たびに存在しない HCA を探しに行って数秒無駄にし、ログにノイズが出る。
      #
      # NVLS は NVSwitch 前提の機能。NVLink の無い機体では無効にしておく。
      #
      # ★ NCCL_P2P_DISABLE は .env 側で決める (ここでは素通し)。
      #   NVLink の無い Blackwell ワークステーション機では P2P 経路が壊れていて
      #   最初の collective でハングするため 1 が必須。NVLink 機では逆に
      #   切ると遅くなるだけなので未設定にする。判断は preflight.sh が出す。
      #   詳しい経緯と上流 issue は .env.example の NCCL の節を読むこと。
      NCCL_IB_DISABLE: ${NCCL_IB_DISABLE:-1}
      NCCL_NVLS_ENABLE: ${NCCL_NVLS_ENABLE:-0}
      NCCL_P2P_DISABLE: ${NCCL_P2P_DISABLE-}
      NCCL_CUMEM_ENABLE: ${NCCL_CUMEM_ENABLE-}
      NCCL_DEBUG: ${NCCL_DEBUG:-WARN}

      # execute_model RPC の既定デッドラインは 300 秒。ウォームアップが踏まなかった
      # MoE / batch shape に当たって推論中に JIT が走ると、worker が生きているのに
      # 「死んだ」と判定されてエンジンごと落ちる。
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: ${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-1800}
      # 初回の torch.compile / Triton JIT は数分 CPU を占有する。
      # NCCL watchdog に殺されないよう延長。
      TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "7200"
      VLLM_WORKER_MULTIPROC_METHOD: ${VLLM_WORKER_MULTIPROC_METHOD-}

      # ---- SM12x 数値契約 (GB10 ブランチから継承) ----
      #
      # ★ VLLM_USE_DEEP_GEMM=0 は維持する。DeepGEMM は sm_90a / sm_100a 向けで
      #   SM12x には対応カーネルが無い。現行 vLLM は capability を見て自分で
      #   外すはずだが、選ばれた場合に黙って壊れる経路なので明示的に殺しておく。
      #   このチェックポイントは MTP の routed experts が 128x128 block FP8 なので
      #   block-FP8 経路は確実に踏む。
      #
      # ★ 他ブランチから持ってこないこと:
      #     VLLM_NVFP4_GEMM_BACKEND   (Nemotron ブランチで使用)
      #     VLLM_USE_FLASHINFER_MOE_FP4 (同上)
      #   どちらも現在の vLLM main には**もう存在しない**。書いても
      #   "Unknown vLLM environment variable" が出るだけで効かない。
      VLLM_USE_DEEP_GEMM: ${VLLM_USE_DEEP_GEMM:-0}
      # 1M は config の max_position_embeddings=262144 を超えるので必須
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: ${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-1}
      # SM120 の NVFP4 MoE 切り分け用 (既定は未設定)。.env の解説を読むこと。
      VLLM_MOE_FORCE_MARLIN: ${VLLM_MOE_FORCE_MARLIN-}

      # ---- ランタイム ----
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      VLLM_CACHE_ROOT: /root/.cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /var/cache/torchinductor
      TRITON_CACHE_DIR: /root/.triton/cache
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # ランタイム JIT が nproc 分 (=32) の nvcc を撒いてホスト RAM を食うのを防ぐ
      MAX_JOBS: ${MAX_JOBS:-8}

    entrypoint: ["bash", "/entrypoint.sh"]

    # host ネットワークは要らない。LAN に出したくなければ .env の
    # API_BIND_ADDR を 127.0.0.1 にする。
    ports:
      - "${API_BIND_ADDR:-0.0.0.0}:${HOST_PORT:-8910}:${HOST_PORT:-8910}"

    volumes:
      - ${MODEL_PATH}:${MODEL_CONTAINER_PATH}:ro
      - ./scripts/entrypoint.sh:/entrypoint.sh:ro
      - ./vllm-cache/vllm:/root/.cache/vllm
      - ./vllm-cache/triton:/root/.triton
      - ./vllm-cache/torchinductor:/var/cache/torchinductor
      - ./vllm-cache/huggingface:/cache/huggingface

    # TP=2 の worker 間は共有メモリで殴り合うので host IPC を使う。
    # (ipc: host を付けると shm_size は無視されるため書いていない)
    ipc: host

    gpus: all

    # /etc/nvidia-container-runtime/config.toml が no-cgroups=true (rootless 用
    # 設定) だと nvidia-container-cli が device cgroup の許可リストを更新せず、
    # コンテナ内にノードは見えるのにアクセスが弾かれて vLLM が
    # "Failed to infer device type" で死ぬ。明示的に渡して cgroup を通す。
    # ★ /dev/nvidiaN は**使う GPU の枚数だけ**並べること。下は 2 枚構成の例で、
    #   4 枚なら nvidia2 / nvidia3 の行を足す。`ls /dev/nvidia[0-9]*` で確認。
    #   足りないと entrypoint の GPU 枚数チェックで止まる。
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidia1:/dev/nvidia1
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools

    # ★ memlock は意図的に指定していない。RDMA (ibverbs) を使う構成でのみ必要で、
    #   GPU 間が PCIe / NVLink だけなら要らない (CUDA の pinned host memory は
    #   ドライバ側の経路で確保され RLIMIT_MEMLOCK に計上されない)。
    #   rootless Docker では、ホストの `ulimit -Hl` を超える値を書くと
    #   ハード rlimit の引き上げに CAP_SYS_RESOURCE が要るため
    #   "error setting rlimit type 8: operation not permitted" で起動できない。
    #   stack は soft を上げるだけなのでハード上限 (通常 unlimited) 以内に収まる。
    ulimits:
      stack:
        soft: 67108864
        hard: 67108864

    # 意図的に restart させない。EngineCore の初期化失敗で無限再起動すると、
    # 124 GiB のチェックポイントを毎回読み直して NVMe とページキャッシュを
    # 延々と叩き続ける。安定してから unless-stopped に変えること。
    restart: "no"

    # 初回起動は torch.compile + CUDA graph capture で 10〜20 分かかる。
    # start_period を短くすると起動中に unhealthy 判定されるので注意。
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen(
                  "http://127.0.0.1:${HOST_PORT:-8910}/health", timeout=5
              ).status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
