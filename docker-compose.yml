# =============================================================================
# DeepSeek-V4-Flash-0731 on 2x NVIDIA DGX Spark (GB10 / SM121)
#
#   TP=2 (1 GPU/node) / distributed-executor-backend = mp (Ray なし)
#   NCCL は 200GbE QSFP の RoCEv2 (RDMA) 経由、bootstrap も同じ IF の TCP
#   native DSpark speculative decoding (k=7)
#
# API は ${HOST_PORT} (既定 8910) に OpenAI 互換で生える。
#
# rootful Docker が必須 (--device /dev/infiniband, memlock unlimited,
# host network + RDMA)。必ず `sudo docker compose ...` で起動すること。
#
#   worker 側 (先に起動):  sudo docker compose --profile worker up -d
#   head 側   (後で起動):  sudo docker compose --profile head   up -d
# =============================================================================

x-vllm-env: &vllm-env
  # ---- モデル / サービング ----
  MODEL_CONTAINER_PATH: ${MODEL_CONTAINER_PATH}
  SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
  HOST_PORT: ${HOST_PORT:-8910}
  MAX_MODEL_LEN: ${MAX_MODEL_LEN:-262144}
  MAX_NUM_SEQS: ${MAX_NUM_SEQS:-1}
  MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
  GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.87}
  VLLM_PARSER_ARGS: ${VLLM_PARSER_ARGS:-}
  VLLM_KV_ARGS: ${VLLM_KV_ARGS:-}
  VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}

  # ---- トポロジ ----
  TP_SIZE: ${TP_SIZE:-2}
  NNODES: ${NNODES:-2}
  MASTER_PORT: ${MASTER_PORT:-29501}
  HEAD_ROCE_IP: ${HEAD_ROCE_IP}
  WORKER_ROCE_IP: ${WORKER_ROCE_IP}
  ROCE_IF_NAME: ${ROCE_IF_NAME}
  IB_HCA_NAME: ${IB_HCA_NAME}

  # ---- NCCL / RoCE ----
  # Spark は RoCE ポートを 2 本見せるがケーブルが刺さっているのは 1 本だけ。
  # 刺さっていない側の GID index 3 は空なので、必ずケーブル側の HCA に固定する。
  # (`show_gids` で「RoCE v2 かつ IPv4 が enp1s0f0np0 のアドレス」の index を確認)
  NCCL_IB_DISABLE: ${NCCL_IB_DISABLE:-0}
  NCCL_IB_HCA: ${IB_HCA_NAME}
  NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX-}
  NCCL_SOCKET_IFNAME: ${ROCE_IF_NAME}
  GLOO_SOCKET_IFNAME: ${ROCE_IF_NAME}
  TP_SOCKET_IFNAME: ${ROCE_IF_NAME}
  UCX_NET_DEVICES: ${ROCE_IF_NAME}
  NCCL_IGNORE_CPU_AFFINITY: ${NCCL_IGNORE_CPU_AFFINITY:-1}
  NCCL_NVLS_ENABLE: ${NCCL_NVLS_ENABLE:-0}
  NCCL_DEBUG: ${NCCL_DEBUG:-WARN}
  # `:-` ではなく `-` なのは、presets/ 側で「空にして無効化する」ためにわざと。
  # (`:-` だと空文字も未設定扱いになって既定値に戻ってしまう)
  VLLM_NCCL_SO_PATH: ${VLLM_NCCL_SO_PATH-/usr/lib/aarch64-linux-gnu/libnccl.so.2}
  NCCL_NET: ${NCCL_NET:-}
  NCCL_CROSS_NIC: ${NCCL_CROSS_NIC:-}
  NCCL_CUMEM_ENABLE: ${NCCL_CUMEM_ENABLE:-}
  NCCL_IB_ADDR_FAMILY: ${NCCL_IB_ADDR_FAMILY:-}
  NCCL_IB_ROCE_VERSION_NUM: ${NCCL_IB_ROCE_VERSION_NUM:-}
  # dual-HCA (QSFP は 2 枚の NIC に見える) で 2 本を 1 本に束ねる。
  # `-` なので .env で空にすれば entrypoint が unset する。
  NCCL_IB_MERGE_NICS: ${NCCL_IB_MERGE_NICS-}
  # execute_model RPC の既定デッドラインは 300 秒。ウォームアップが踏まなかった
  # MoE / batch shape に当たって推論中に CuTeDSL/TileLang の JIT が走ると、
  # worker が生きているのに「死んだ」と判定されてエンジンごと落ちる。
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: ${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-1800}
  # 初回の Triton/DeepGEMM JIT は数分 CPU を占有する。NCCL watchdog に殺されないよう延長。
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "7200"
  # HPC-X の NCCL RDMA plugin を pip 版 NCCL から見えるようにする。
  # イメージ側の LD_LIBRARY_PATH を潰さないよう、entrypoint が「前に足す」。
  # 別イメージ (anemll 等) に差し替えるときは presets/ で上書きする。
  VLLM_LD_LIBRARY_PATH_EXTRA: ${VLLM_LD_LIBRARY_PATH_EXTRA:-/opt/hpcx/nccl_rdma_sharp_plugin/lib:/usr/local/lib/python3.12/dist-packages/nvidia/nccl/lib:/usr/local/lib/python3.12/dist-packages/torch/lib:/usr/local/lib/python3.12/dist-packages/torch_tensorrt/lib:/usr/local/cuda/compat/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64}

  # ---- SM121 数値契約 (チューニングではなく必須) ----
  # 既定イメージ (bjk110 / DeepGEMM FP8 経路) 用。anemll イメージは b12x MoE を
  # 使うので presets/anemll-1m.env が空にする (空文字は entrypoint が unset する)。
  VLLM_USE_DEEP_GEMM_E8M0: ${VLLM_USE_DEEP_GEMM_E8M0-1}
  VLLM_MOE_USE_DEEP_GEMM: ${VLLM_MOE_USE_DEEP_GEMM-0}
  FLASHINFER_CUDA_ARCH_LIST: ${FLASHINFER_CUDA_ARCH_LIST:-12.1}
  TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-12.1a}

  # ---- b12x / NVFP4 DS-MLA (anemll イメージのときだけ値が入る) ----
  # 既定イメージでは未登録の変数なので、空のまま渡すと vLLM が
  # "Unknown vLLM environment variable" を出す。空文字は entrypoint が unset する。
  VLLM_USE_B12X_MOE: ${VLLM_USE_B12X_MOE:-}
  VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: ${VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM:-}
  VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: ${VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M:-}
  VLLM_USE_FLASHINFER_SAMPLER: ${VLLM_USE_FLASHINFER_SAMPLER:-}
  FLASHINFER_DISABLE_VERSION_CHECK: ${FLASHINFER_DISABLE_VERSION_CHECK:-}
  FLASHINFER_WORKSPACE_BASE: ${FLASHINFER_WORKSPACE_BASE:-}
  TILELANG_CLEANUP_TEMP_FILES: ${TILELANG_CLEANUP_TEMP_FILES:-}
  DG_JIT_USE_NVRTC: ${DG_JIT_USE_NVRTC:-}
  DG_JIT_NVCC_COMPILER: ${DG_JIT_NVCC_COMPILER:-}
  # CuTeDSL の kernel コンパイル対象。VLLM_* ではないので warning は出ない。
  # 未指定だと b12x が GB10 native ではない遅い W4A16 経路を JIT することがある。
  CUTE_DSL_ARCH: ${CUTE_DSL_ARCH:-}
  # 0731 同梱の encoding_dsv4.py をランタイムに入れる (=1 のときだけ)
  DSPARK_ENCODING_INSTALL: ${DSPARK_ENCODING_INSTALL:-0}
  DSPARK_ENCODING_FILE: ${DSPARK_ENCODING_FILE:-}

  # ---- MiaAI-Lab 移植版の hotfix 適用 (Vision-Exp を動かすのに必須) ----
  # =1 で entrypoint が patches/ の hotfix をコンテナ起動時に当てる。vision の
  # 有効化 (hotfix-dsv4-vision-exp.py) もこの中。既定イメージでは 0 のまま。
  # 詳細は presets/anemll-vision-1m.env と README の「⛔ 現状ブロック中」。
  DSPARK_APPLY_HOTFIXES: ${DSPARK_APPLY_HOTFIXES:-0}
  # 個別に外したいときだけ 1 にする (既定は全部当てる)。
  DSPARK_SKIP_HOTFIX: ${DSPARK_SKIP_HOTFIX:-0}
  VLLM_USE_B12X_WO_PROJECTION: ${VLLM_USE_B12X_WO_PROJECTION:-}
  # b12x / TileLang / DeepGEMM の JIT キャッシュ。イメージ既定はコンテナ内の
  # ホームなので再作成で消える。既存の vllm-cache/ マウントの下に逃がす。
  TILELANG_CACHE_DIR: ${TILELANG_CACHE_DIR:-/root/.cache/vllm/tilelang}
  TRITON_CACHE_DIR: ${TRITON_CACHE_DIR:-/root/.triton/cache}
  DG_JIT_CACHE_DIR: ${DG_JIT_CACHE_DIR:-/root/.cache/vllm/deepgemm}
  B12X_CUTE_COMPILE_CACHE_DIR: ${B12X_CUTE_COMPILE_CACHE_DIR:-/root/.cache/vllm/b12x-cute}

  # ---- ランタイム ----
  NVIDIA_VISIBLE_DEVICES: all
  PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: ${VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS:-1}
  VLLM_USE_BREAKABLE_CUDAGRAPH: ${VLLM_USE_BREAKABLE_CUDAGRAPH:-0}
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: ${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-256}
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: ${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-}
  VLLM_ATTENTION_BACKEND: ${VLLM_ATTENTION_BACKEND:-}
  VLLM_CACHE_ROOT: /root/.cache/vllm
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  # ランタイム JIT が nproc 分の nvcc を撒いて UMA を食い潰すのを防ぐ
  MAX_JOBS: ${MAX_JOBS:-4}

x-vllm-service: &vllm-service
  image: ${VLLM_IMAGE}
  network_mode: host
  ipc: host
  shm_size: "64gb"
  entrypoint: ["bash", "/entrypoint.sh"]
  volumes:
    - ${MODEL_PATH}:${MODEL_CONTAINER_PATH}:ro
    - ./scripts/entrypoint.sh:/entrypoint.sh:ro
    # MiaAI-Lab 移植版の hotfix 群。DSPARK_APPLY_HOTFIXES=1 のときだけ使われる。
    - ./patches:/opt/dspark-patches:ro
    - ./vllm-cache/vllm:/root/.cache/vllm
    - ./vllm-cache/triton:/root/.triton
    - ./vllm-cache/torchinductor:/var/cache/torchinductor
    - ./vllm-cache/huggingface:/cache/huggingface
    - /sys/class/infiniband:/sys/class/infiniband:ro
  devices:
    - /dev/infiniband:/dev/infiniband
    # /etc/nvidia-container-runtime/config.toml が no-cgroups=true (rootless docker で
    # GPU を使うのに必須の設定) だと、nvidia-container-cli が device cgroup の許可
    # リストを更新しない。コンテナ内にノードは現れるがアクセスが弾かれ、vLLM が
    # "Failed to infer device type" で死ぬ。ここで明示的に渡して cgroup を通す。
    # これでもダメなら privileged: true を足す (device cgroup ごとバイパスされる)。
    - /dev/nvidia0:/dev/nvidia0
    - /dev/nvidiactl:/dev/nvidiactl
    - /dev/nvidia-uvm:/dev/nvidia-uvm
    - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
  ulimits:
    memlock:
      soft: -1
      hard: -1
    stack:
      soft: 67108864
      hard: 67108864
  # rootful docker 側に nvidia ランタイムが登録されている必要がある。
  # 未登録だとコンテナ内で NVML が初期化できず、vLLM が
  # "Failed to infer device type" で即死する。
  #   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
  gpus: all
  # 意図的に restart させない。EngineCore の初期化失敗で無限再起動すると
  # GB10 の unified memory を食い潰してホストごと巻き込む。
  restart: "no"

services:
  head:
    <<: *vllm-service
    container_name: dsv4-head
    profiles: ["head"]
    environment:
      <<: *vllm-env
      ROLE: head
      NODE_RANK: "0"
      VLLM_HOST_IP: ${HEAD_ROCE_IP}

  worker:
    <<: *vllm-service
    container_name: dsv4-worker
    profiles: ["worker"]
    environment:
      <<: *vllm-env
      ROLE: worker
      NODE_RANK: "1"
      VLLM_HOST_IP: ${WORKER_ROCE_IP}
      # QSFP を直結ではなくリング配線している場合、head と worker で「相手を向いて
      # いるポート」の名前が違う (例: head=enp1s0f0np0 / worker=enp1s0f1np1)。
      # .env に WORKER_* を書けばここだけ差し替わる。未設定なら head と同じ値。
      ROCE_IF_NAME: ${WORKER_ROCE_IF_NAME:-${ROCE_IF_NAME}}
      IB_HCA_NAME: ${WORKER_IB_HCA_NAME:-${IB_HCA_NAME}}
      NCCL_IB_HCA: ${WORKER_IB_HCA_NAME:-${IB_HCA_NAME}}
      NCCL_SOCKET_IFNAME: ${WORKER_ROCE_IF_NAME:-${ROCE_IF_NAME}}
      GLOO_SOCKET_IFNAME: ${WORKER_ROCE_IF_NAME:-${ROCE_IF_NAME}}
      TP_SOCKET_IFNAME: ${WORKER_ROCE_IF_NAME:-${ROCE_IF_NAME}}
      UCX_NET_DEVICES: ${WORKER_ROCE_IF_NAME:-${ROCE_IF_NAME}}
      NCCL_IB_GID_INDEX: ${WORKER_NCCL_IB_GID_INDEX-${NCCL_IB_GID_INDEX-}}
