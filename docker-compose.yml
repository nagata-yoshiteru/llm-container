# =============================================================================
# MiniMax-M3 (NVFP4) on 3x NVIDIA DGX Spark (GB10 / SM121)
#
#   PP=3 / TP=1 (1 GPU/node) / distributed-executor-backend = ray
#   NCCL データ面 = 200G QSFP の三角メッシュ (RoCEv2)
#   Ray と NCCL bootstrap = 10GbE 管理 NIC (enP7s7)
#
# API は ${HOST_PORT} (既定 8910) に OpenAI / Anthropic 互換で生える。
#
# rootful Docker が必須 (--device /dev/infiniband, memlock unlimited,
# host network + RDMA)。必ず `sudo docker compose ...` で起動すること。
#
#   worker2: sudo docker compose --profile worker2 up -d   # 先に
#   worker1: sudo docker compose --profile worker1 up -d   # 次に
#   head:    sudo docker compose --profile head    up -d   # 最後
# =============================================================================

x-vllm-env: &vllm-env
  # ---- モデル / サービング ----
  MODEL_CONTAINER_PATH: ${MODEL_CONTAINER_PATH}
  SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
  HOST_PORT: ${HOST_PORT:-8910}
  MAX_MODEL_LEN: ${MAX_MODEL_LEN:-262144}
  MAX_NUM_SEQS: ${MAX_NUM_SEQS:-2}
  MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-1024}
  GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.82}
  VLLM_QUANT_ARGS: ${VLLM_QUANT_ARGS:-}
  VLLM_PARSER_ARGS: ${VLLM_PARSER_ARGS:-}
  VLLM_KV_ARGS: ${VLLM_KV_ARGS:-}
  VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
  VLLM_SPEC_ARGS: ${VLLM_SPEC_ARGS:-}

  # ---- トポロジ ----
  TP_SIZE: ${TP_SIZE:-1}
  PP_SIZE: ${PP_SIZE:-3}
  NNODES: ${NNODES:-3}
  DIST_BACKEND: ${DIST_BACKEND:-ray}
  MASTER_PORT: ${MASTER_PORT:-29501}
  RAY_PORT: ${RAY_PORT:-6379}
  OOB_IF_NAME: ${OOB_IF_NAME}
  NODE0_MGMT_IP: ${NODE0_MGMT_IP}
  NODE1_MGMT_IP: ${NODE1_MGMT_IP}
  NODE2_MGMT_IP: ${NODE2_MGMT_IP}

  # ---- NCCL / RoCE (3 ノードメッシュ) ----
  # NCCL_IB_GID_INDEX は【意図的に渡していない】。固定すると subnet-aware routing が
  # 無効になり、隣人ごとに正しい HCA を選べずクロスペアリングして err 110 で死ぬ。
  # 2 ノード直結の設定 (GID_INDEX=3 固定) をここに持ち込まないこと。
  NCCL_IB_DISABLE: ${NCCL_IB_DISABLE:-0}
  NCCL_NET: ${NCCL_NET:-IB}
  NCCL_IB_HCA: ${NCCL_IB_HCA}
  NCCL_IB_ADDR_RANGE: ${NCCL_IB_ADDR_RANGE}
  NCCL_IB_MERGE_NICS: ${NCCL_IB_MERGE_NICS:-0}
  NCCL_NET_PLUGIN: ${NCCL_NET_PLUGIN:-none}
  NCCL_IB_SUBNET_AWARE_ROUTING: ${NCCL_IB_SUBNET_AWARE_ROUTING:-1}
  NCCL_CROSS_NIC: ${NCCL_CROSS_NIC:-1}
  NCCL_IB_ADDR_FAMILY: ${NCCL_IB_ADDR_FAMILY:-AF_INET}
  NCCL_IB_ROCE_VERSION_NUM: ${NCCL_IB_ROCE_VERSION_NUM:-2}
  NCCL_NET_GDR_LEVEL: ${NCCL_NET_GDR_LEVEL:-LOC}
  NCCL_CUMEM_ENABLE: ${NCCL_CUMEM_ENABLE:-0}
  NCCL_IGNORE_CPU_AFFINITY: ${NCCL_IGNORE_CPU_AFFINITY:-1}
  NCCL_NVLS_ENABLE: ${NCCL_NVLS_ENABLE:-0}
  NCCL_DEBUG: ${NCCL_DEBUG:-WARN}
  # bootstrap / Gloo は全ノードが到達できる管理 NIC を通す。RoCE 側は
  # 各ノードが 2 つの隣人としか繋がっていないので制御面には使えない。
  NCCL_SOCKET_IFNAME: ${OOB_IF_NAME}
  GLOO_SOCKET_IFNAME: ${OOB_IF_NAME}
  TP_SOCKET_IFNAME: ${OOB_IF_NAME}
  # 初回の torch.compile / cute-dsl JIT は数分 CPU を占有する。watchdog を延長。
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "7200"

  # ---- GB10 (sm_121) 向け ----
  # NGC イメージ自体は "12.0+PTX" までしか SASS を持たないので、実行時 JIT が
  # 走るものはここを見て 12.1 向けに出す。b12x 系の VLLM_USE_B12X_* は
  # chthonic イメージ専用なので渡さない。
  TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-12.1a}
  FLASHINFER_CUDA_ARCH_LIST: ${FLASHINFER_CUDA_ARCH_LIST:-12.1}
  SAFETENSORS_FAST_GPU: ${SAFETENSORS_FAST_GPU:-1}

  # ---- ランタイム ----
  NVIDIA_VISIBLE_DEVICES: all
  PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
  VLLM_CACHE_ROOT: /root/.cache/vllm
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  MAX_JOBS: ${MAX_JOBS:-4}

  # ---- Ray ----
  # 既定の plasma 予約 (約36GB/node) は vLLM が一切使わないのに UMA を食う。
  # メモリ監視は 95% 閾値で rank0 を誤検知 kill するので切る。
  RAY_OBJECT_STORE_MEMORY: ${RAY_OBJECT_STORE_MEMORY:-1073741824}
  RAY_memory_monitor_refresh_ms: ${RAY_memory_monitor_refresh_ms:-0}
  RAY_DEDUP_LOGS: ${RAY_DEDUP_LOGS:-0}
  RAY_INCLUDE_DASHBOARD: ${RAY_INCLUDE_DASHBOARD:-1}

x-vllm-service: &vllm-service
  build:
    context: .
    args:
      VLLM_BASE_IMAGE: ${VLLM_BASE_IMAGE}
  image: ${VLLM_IMAGE}
  network_mode: host
  ipc: host
  shm_size: "64gb"
  entrypoint: ["bash", "/entrypoint.sh"]
  volumes:
    - ${MODEL_PATH}:${MODEL_CONTAINER_PATH}:ro
    - ./scripts/entrypoint.sh:/entrypoint.sh:ro
    - ./vllm-cache/vllm:/root/.cache/vllm
    - ./vllm-cache/triton:/root/.triton
    - ./vllm-cache/torchinductor:/var/cache/torchinductor
    - ./vllm-cache/huggingface:/cache/huggingface
    - /sys/class/infiniband:/sys/class/infiniband:ro
  devices:
    - /dev/infiniband:/dev/infiniband
    # /etc/nvidia-container-runtime/config.toml が no-cgroups=true (rootless docker で
    # GPU を使うのに必須の設定) だと、nvidia-container-cli が device cgroup の許可
    # リストを更新しない。コンテナ内にノードは現れるがアクセスが弾かれ、vLLM が
    # "Failed to infer device type" で死ぬ。ここで明示的に渡して cgroup を通す。
    # これでもダメなら privileged: true を足す (device cgroup ごとバイパスされる)。
    - /dev/nvidia0:/dev/nvidia0
    - /dev/nvidiactl:/dev/nvidiactl
    - /dev/nvidia-uvm:/dev/nvidia-uvm
    - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 1048576
      hard: 1048576
    stack:
      soft: 67108864
      hard: 67108864
  # rootful docker 側に nvidia ランタイムが登録されている必要がある。
  #   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
  gpus: all
  # 意図的に restart させない。EngineCore の初期化失敗で無限再起動すると
  # GB10 の unified memory を食い潰してホストごと巻き込む。
  restart: "no"

services:
  head:
    <<: *vllm-service
    container_name: m3-head
    profiles: ["head"]
    environment:
      <<: *vllm-env
      ROLE: head
      NODE_RANK: "0"
      NODE_MGMT_IP: ${NODE0_MGMT_IP}
      VLLM_HOST_IP: ${NODE0_MGMT_IP}

  worker1:
    <<: *vllm-service
    container_name: m3-worker1
    profiles: ["worker1"]
    environment:
      <<: *vllm-env
      ROLE: worker
      NODE_RANK: "1"
      NODE_MGMT_IP: ${NODE1_MGMT_IP}
      VLLM_HOST_IP: ${NODE1_MGMT_IP}

  worker2:
    <<: *vllm-service
    container_name: m3-worker2
    profiles: ["worker2"]
    environment:
      <<: *vllm-env
      ROLE: worker
      NODE_RANK: "2"
      NODE_MGMT_IP: ${NODE2_MGMT_IP}
      VLLM_HOST_IP: ${NODE2_MGMT_IP}
