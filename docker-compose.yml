# =============================================================================
# dealignai/GLM-5.3-Flash-UNCENSORED-FP8 on 3x NVIDIA DGX Spark (GB10 / SM121)
#   光スイッチ経由 (フルメッシュ / 同一 L2)。RING ではない。
#
#   並列化 = TP=1 + DP=3 + EP=3 (--enable-expert-parallel)
#     vllm 公式の multi-node internal DP。各ノードが自分の vllm serve を持ち、
#     head の --data-parallel-rpc-port (= DP coordinator) にぶら下がる。
#     HTTP (OpenAI 互換) は head の ${HOST_PORT} 1 本だけ。
#
#   なぜ TP=3 / PP=3 ではないか → scripts/entrypoint.sh の冒頭コメント参照。
#   要点: glm5_next は num_heads=64 / vocab=154880 が 3 で割れず TP=3 は assert、
#   PP は make_empty_intermediate_tensors 未実装で vllm 側がゲートしている。
#
#   ★ メモリは極端に厳しい。重み ~107GiB/rank なので GPU_MEMORY_UTILIZATION は
#     0.92〜0.95 で調整。起動前に ./scripts/preflight.sh を 3 台とも実行。
#
# rootful Docker が必須 (--device /dev/infiniband, memlock unlimited,
# host network + RDMA)。必ず `sudo docker compose ...` で起動すること。
#
#   worker2 側 (先):  sudo docker compose --profile worker2 up -d
#   worker1 側 (次):  sudo docker compose --profile worker1 up -d
#   head 側   (最後): sudo docker compose --profile head    up -d
#
#   ★ DP coordinator は head。worker を先に上げても coordinator が居ないので
#     worker はリトライしつつ待つ。head を最後に上げるのが素直。
# =============================================================================

x-vllm-env: &vllm-env
  # ---- モデル / サービング ----
  MODEL_CONTAINER_PATH: ${MODEL_CONTAINER_PATH}
  SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
  HOST_PORT: ${HOST_PORT:-8910}
  MAX_MODEL_LEN: ${MAX_MODEL_LEN:-262144}
  MAX_NUM_SEQS: ${MAX_NUM_SEQS:-6}
  MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-}
  GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.92}
  VLLM_PARSER_ARGS: ${VLLM_PARSER_ARGS:-}
  VLLM_KV_ARGS: ${VLLM_KV_ARGS:-}
  VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}

  # ---- entrypoint がフラグに変換するスイッチ ----
  LANGUAGE_MODEL_ONLY: ${LANGUAGE_MODEL_ONLY:-1}
  ENFORCE_EAGER: ${ENFORCE_EAGER:-1}
  SKIP_MM_PROFILING: ${SKIP_MM_PROFILING:-}
  LIMIT_MM: ${LIMIT_MM:-}

  # ---- トポロジ (TP=1 / DP=3 / EP=3) ----
  TP_SIZE: ${TP_SIZE:-1}
  DP_SIZE: ${DP_SIZE:-3}
  NNODES: ${NNODES:-3}
  DP_RPC_PORT: ${DP_RPC_PORT:-13345}
  HEAD_ROCE_IP: ${HEAD_ROCE_IP}
  WORKER1_ROCE_IP: ${WORKER1_ROCE_IP}
  WORKER2_ROCE_IP: ${WORKER2_ROCE_IP}
  ROCE_IF_NAME: ${ROCE_IF_NAME}
  IB_HCA_NAME: ${IB_HCA_NAME}

  # ---- NCCL / RoCE ----
  # 光スイッチはジャンボを通さない (MTU 1500 / RoCE active_mtu 1024)。
  # また 4 ポートとも同じ L2 に見えるので、GID index は固定しない
  # (固定するとリンクイベントでずれて片側だけ無言ハングする)。
  NCCL_IB_DISABLE: ${NCCL_IB_DISABLE:-0}
  NCCL_IB_HCA: ${IB_HCA_NAME}
  NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX-}
  NCCL_SOCKET_IFNAME: ${ROCE_IF_NAME}
  GLOO_SOCKET_IFNAME: ${ROCE_IF_NAME}
  TP_SOCKET_IFNAME: ${ROCE_IF_NAME}
  UCX_NET_DEVICES: ${ROCE_IF_NAME}
  NCCL_IGNORE_CPU_AFFINITY: ${NCCL_IGNORE_CPU_AFFINITY:-1}
  NCCL_NVLS_ENABLE: ${NCCL_NVLS_ENABLE:-0}
  NCCL_DEBUG: ${NCCL_DEBUG:-WARN}
  # UMA 向け NCCL バッファ調整 (空なら unset)。
  NCCL_BUFFSIZE: ${NCCL_BUFFSIZE:-}
  NCCL_LL128_BUFFSIZE: ${NCCL_LL128_BUFFSIZE:-}
  NCCL_PROTO: ${NCCL_PROTO:-}
  NCCL_MAX_NCHANNELS: ${NCCL_MAX_NCHANNELS:-}
  # `:-` ではなく `-` なのは、「空にして無効化する」ためにわざと。
  VLLM_NCCL_SO_PATH: ${VLLM_NCCL_SO_PATH-}
  NCCL_NET: ${NCCL_NET:-}
  NCCL_CROSS_NIC: ${NCCL_CROSS_NIC:-}
  NCCL_CUMEM_ENABLE: ${NCCL_CUMEM_ENABLE:-}
  # RoCE を使うレールを IPv4 で固定する (office LAN に流れるのを防ぐ)。
  # 光スイッチの flat L2 では特に効く。空にすれば unset。
  NCCL_IB_ADDR_FAMILY: ${NCCL_IB_ADDR_FAMILY:-}
  NCCL_IB_ROCE_VERSION_NUM: ${NCCL_IB_ROCE_VERSION_NUM:-}
  NCCL_IB_ADDR_RANGE: ${NCCL_IB_ADDR_RANGE:-}
  # dual-HCA (QSFP は 2 枚の NIC に見える) で 2 本を 1 本に束ねる。
  NCCL_IB_MERGE_NICS: ${NCCL_IB_MERGE_NICS-}
  # 重み 328GB のロード + JIT に時間がかかる。エンジン ready の既定を持ち上げる。
  VLLM_ENGINE_READY_TIMEOUT_S: ${VLLM_ENGINE_READY_TIMEOUT_S:-3600}
  # 初回の Triton / DeepGEMM JIT は数分 CPU を占有する。NCCL watchdog に殺されないよう延長。
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "7200"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: ${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-1800}
  # イメージ側の LD_LIBRARY_PATH を潰さないよう、entrypoint が「前に足す」。
  VLLM_LD_LIBRARY_PATH_EXTRA: ${VLLM_LD_LIBRARY_PATH_EXTRA:-/usr/local/cuda/lib64:/usr/local/nvidia/lib64}

  # ---- GLM-5.3 overlay ノブ (イメージ側が読む) ----
  GLM53_SUPPRESS_STOPS_IN_REASONING: ${GLM53_SUPPRESS_STOPS_IN_REASONING:-}
  GLM53_MIXED_PREFILL_CHUNK: ${GLM53_MIXED_PREFILL_CHUNK:-}
  GLM53_SPINWAIT_MS: ${GLM53_SPINWAIT_MS:-}

  # ---- 数値 / アーキ ----
  # 12.1a は sm_121a 限定指令を有効にする上流レシピの値。
  FLASHINFER_CUDA_ARCH_LIST: ${FLASHINFER_CUDA_ARCH_LIST:-12.1a}
  TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-12.1a}
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: ${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-256}
  # Triton / TileLang / DeepGEMM の JIT キャッシュ。コンテナ再作成で消えないよう逃がす。
  TILELANG_CACHE_DIR: ${TILELANG_CACHE_DIR:-/root/.cache/vllm/tilelang}
  TRITON_CACHE_DIR: ${TRITON_CACHE_DIR:-/root/.triton/cache}
  DG_JIT_CACHE_DIR: ${DG_JIT_CACHE_DIR:-/root/.cache/vllm/deepgemm}

  # ---- ランタイム ----
  NVIDIA_VISIBLE_DEVICES: all
  PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
  VLLM_CACHE_ROOT: /root/.cache/vllm
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  # ランタイム JIT が nproc 分の nvcc を撒いて UMA を食い潰すのを防ぐ
  MAX_JOBS: ${MAX_JOBS:-4}

x-vllm-service: &vllm-service
  image: ${VLLM_IMAGE}
  network_mode: host
  ipc: host
  shm_size: "64gb"
  entrypoint: ["bash", "/entrypoint.sh"]
  volumes:
    - ${MODEL_PATH}:${MODEL_CONTAINER_PATH}:ro
    - ./scripts/entrypoint.sh:/entrypoint.sh:ro
    - ./vllm-cache/vllm:/root/.cache/vllm
    - ./vllm-cache/triton:/root/.triton
    - ./vllm-cache/torchinductor:/var/cache/torchinductor
    - ./vllm-cache/huggingface:/cache/huggingface
    - /sys/class/infiniband:/sys/class/infiniband:ro
  devices:
    - /dev/infiniband:/dev/infiniband
    # /etc/nvidia-container-runtime/config.toml が no-cgroups=true (rootless docker で
    # GPU を使うのに必須の設定) だと、nvidia-container-cli が device cgroup の許可
    # リストを更新しない。コンテナ内にノードは現れるがアクセスが弾かれ、vLLM が
    # "Failed to infer device type" で死ぬ。ここで明示的に渡して cgroup を通す。
    # これでもダメなら privileged: true を足す (device cgroup ごとバイパスされる)。
    - /dev/nvidia0:/dev/nvidia0
    - /dev/nvidiactl:/dev/nvidiactl
    - /dev/nvidia-uvm:/dev/nvidia-uvm
    - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
  ulimits:
    memlock:
      soft: -1
      hard: -1
    stack:
      soft: 67108864
      hard: 67108864
  # rootful docker 側に nvidia ランタイムが登録されている必要がある。
  # 未登録だとコンテナ内で NVML が初期化できず、vLLM が
  # "Failed to infer device type" で即死する。
  #   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
  gpus: all
  # kernel OOM のとき、デスクトップや関連デーモンではなく vLLM を選んで殺させる。
  oom_score_adj: 1000
  # 意図的に restart させない。EngineCore の初期化失敗で無限再起動すると
  # GB10 の unified memory を食い潰してホストごと巻き込む。
  restart: "no"

services:
  # DP rank 0 / API サーバ / DP coordinator。最後に上げる。
  head:
    <<: *vllm-service
    container_name: glm53-fp8-head
    profiles: ["head"]
    environment:
      <<: *vllm-env
      ROLE: head
      DP_START_RANK: "0"
      VLLM_HOST_IP: ${HEAD_ROCE_IP}

  # DP rank 1
  worker1:
    <<: *vllm-service
    container_name: glm53-fp8-worker1
    profiles: ["worker1"]
    environment:
      <<: *vllm-env
      ROLE: worker
      DP_START_RANK: "1"
      VLLM_HOST_IP: ${WORKER1_ROCE_IP}

  # DP rank 2
  worker2:
    <<: *vllm-service
    container_name: glm53-fp8-worker2
    profiles: ["worker2"]
    environment:
      <<: *vllm-env
      ROLE: worker
      DP_START_RANK: "2"
      VLLM_HOST_IP: ${WORKER2_ROCE_IP}
