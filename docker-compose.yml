# =============================================================================
# DeepSeek-V4-Flash-0731 on 2x NVIDIA DGX Spark (GB10 / SM121)
#
#   TP=2 (1 GPU/node) / distributed-executor-backend = mp (Ray なし)
#   NCCL は 200GbE QSFP の RoCEv2 (RDMA) 経由、bootstrap も同じ IF の TCP
#   native DSpark speculative decoding (k=7)
#
# API は ${HOST_PORT} (既定 8910) に OpenAI 互換で生える。
#
# rootful Docker が必須 (--device /dev/infiniband, memlock unlimited,
# host network + RDMA)。必ず `sudo docker compose ...` で起動すること。
#
#   worker 側 (先に起動):  sudo docker compose --profile worker up -d
#   head 側   (後で起動):  sudo docker compose --profile head   up -d
# =============================================================================

x-vllm-env: &vllm-env
  # ---- モデル / サービング ----
  MODEL_CONTAINER_PATH: ${MODEL_CONTAINER_PATH}
  SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
  HOST_PORT: ${HOST_PORT:-8910}
  MAX_MODEL_LEN: ${MAX_MODEL_LEN:-262144}
  MAX_NUM_SEQS: ${MAX_NUM_SEQS:-1}
  MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
  GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.87}
  VLLM_PARSER_ARGS: ${VLLM_PARSER_ARGS:-}
  VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}

  # ---- トポロジ ----
  TP_SIZE: ${TP_SIZE:-2}
  NNODES: ${NNODES:-2}
  MASTER_PORT: ${MASTER_PORT:-29501}
  HEAD_ROCE_IP: ${HEAD_ROCE_IP}
  WORKER_ROCE_IP: ${WORKER_ROCE_IP}
  ROCE_IF_NAME: ${ROCE_IF_NAME}
  IB_HCA_NAME: ${IB_HCA_NAME}

  # ---- NCCL / RoCE ----
  # Spark は RoCE ポートを 2 本見せるがケーブルが刺さっているのは 1 本だけ。
  # 刺さっていない側の GID index 3 は空なので、必ずケーブル側の HCA に固定する。
  # (`show_gids` で「RoCE v2 かつ IPv4 が enp1s0f0np0 のアドレス」の index を確認)
  NCCL_IB_DISABLE: ${NCCL_IB_DISABLE:-0}
  NCCL_IB_HCA: ${IB_HCA_NAME}
  NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX:-3}
  NCCL_SOCKET_IFNAME: ${ROCE_IF_NAME}
  GLOO_SOCKET_IFNAME: ${ROCE_IF_NAME}
  TP_SOCKET_IFNAME: ${ROCE_IF_NAME}
  UCX_NET_DEVICES: ${ROCE_IF_NAME}
  NCCL_IGNORE_CPU_AFFINITY: ${NCCL_IGNORE_CPU_AFFINITY:-1}
  NCCL_NVLS_ENABLE: ${NCCL_NVLS_ENABLE:-0}
  NCCL_DEBUG: ${NCCL_DEBUG:-WARN}
  VLLM_NCCL_SO_PATH: ${VLLM_NCCL_SO_PATH:-/usr/lib/aarch64-linux-gnu/libnccl.so.2}
  # 初回の Triton/DeepGEMM JIT は数分 CPU を占有する。NCCL watchdog に殺されないよう延長。
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "7200"
  # HPC-X の NCCL RDMA plugin を pip 版 NCCL から見えるようにする
  LD_LIBRARY_PATH: /opt/hpcx/nccl_rdma_sharp_plugin/lib:/usr/local/lib/python3.12/dist-packages/nvidia/nccl/lib:/usr/local/lib/python3.12/dist-packages/torch/lib:/usr/local/lib/python3.12/dist-packages/torch_tensorrt/lib:/usr/local/cuda/compat/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64

  # ---- SM121 数値契約 (チューニングではなく必須) ----
  VLLM_USE_DEEP_GEMM_E8M0: ${VLLM_USE_DEEP_GEMM_E8M0:-1}
  VLLM_MOE_USE_DEEP_GEMM: ${VLLM_MOE_USE_DEEP_GEMM:-0}
  FLASHINFER_CUDA_ARCH_LIST: ${FLASHINFER_CUDA_ARCH_LIST:-12.1}
  TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-12.1a}

  # ---- ランタイム ----
  NVIDIA_VISIBLE_DEVICES: all
  PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: ${VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS:-1}
  VLLM_USE_BREAKABLE_CUDAGRAPH: ${VLLM_USE_BREAKABLE_CUDAGRAPH:-0}
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: ${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-256}
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: ${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-}
  VLLM_ATTENTION_BACKEND: ${VLLM_ATTENTION_BACKEND:-}
  VLLM_CACHE_ROOT: /root/.cache/vllm
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  # ランタイム JIT が nproc 分の nvcc を撒いて UMA を食い潰すのを防ぐ
  MAX_JOBS: ${MAX_JOBS:-4}

x-vllm-service: &vllm-service
  image: ${VLLM_IMAGE}
  network_mode: host
  ipc: host
  shm_size: "64gb"
  entrypoint: ["bash", "/entrypoint.sh"]
  volumes:
    - ${MODEL_PATH}:${MODEL_CONTAINER_PATH}:ro
    - ./scripts/entrypoint.sh:/entrypoint.sh:ro
    - ./vllm-cache/vllm:/root/.cache/vllm
    - ./vllm-cache/triton:/root/.triton
    - ./vllm-cache/torchinductor:/var/cache/torchinductor
    - ./vllm-cache/huggingface:/cache/huggingface
    - /sys/class/infiniband:/sys/class/infiniband:ro
  devices:
    - /dev/infiniband:/dev/infiniband
  ulimits:
    memlock:
      soft: -1
      hard: -1
    stack:
      soft: 67108864
      hard: 67108864
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  # 意図的に restart させない。EngineCore の初期化失敗で無限再起動すると
  # GB10 の unified memory を食い潰してホストごと巻き込む。
  restart: "no"

services:
  head:
    <<: *vllm-service
    container_name: dsv4-head
    profiles: ["head"]
    environment:
      <<: *vllm-env
      ROLE: head
      NODE_RANK: "0"
      VLLM_HOST_IP: ${HEAD_ROCE_IP}

  worker:
    <<: *vllm-service
    container_name: dsv4-worker
    profiles: ["worker"]
    environment:
      <<: *vllm-env
      ROLE: worker
      NODE_RANK: "1"
      VLLM_HOST_IP: ${WORKER_ROCE_IP}
